name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYTHON'
          import os
          import runpy
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          runtime_version = runpy.run_path("src/aimx/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag != f"v{version}" or runtime_version != version:
              raise SystemExit(f"Release version mismatch: tag={tag}, package={version}, runtime={runtime_version}")
          PYTHON

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Build
        run: uv run --with build python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
[project]
name = "{{ project_name }}"
version = "0.1.0"
description = "Aimx AutoResearch {{ stack }} repository"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "aim==3.27.0",
    "aimx>=0.3.3",
    "hydra-core>=1.3",
    "lightning>=2.3",
    "numpy>=1.24,<2.0.0",
    "omegaconf>=2.3",
    "rich>=13.7",
    "rootutils>=1.0.7",
    "sqlalchemy==1.4.49",
    "torch>=2.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/{{ package_name }}"]
